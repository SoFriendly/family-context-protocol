{{define "head"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.}} · FCP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2215%22 fill=%22%23F26A1B%22/%3E%3Crect x=%2212%22 y=%2218%22 width=%2228%22 height=%2211%22 rx=%225.5%22 fill=%22%23fff%22/%3E%3Crect x=%2224%22 y=%2235%22 width=%2228%22 height=%2211%22 rx=%225.5%22 fill=%22%23fff%22 fill-opacity=%22.72%22/%3E%3C/svg%3E">
<style>
:root{--bg:#fbfaf7;--fg:#1d1c1a;--mute:#6b6862;--line:#e3e0d8;--card:#fff;--accent:#c2410c;--warn:#9a3b2e;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ecebe6;--mute:#9b988f;--line:#2e2d2a;--card:#1e1e1c;--accent:#ff8a4c;--warn:#e08a7a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,sans-serif}
main{max-width:52rem;margin:0 auto;padding:1.5rem 1rem 4rem}
header{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:.75rem;margin-bottom:1.5rem}
header h1{font-size:1.25rem;margin:0;display:flex;align-items:center;gap:.5rem}header h1::before{content:"";width:1.4rem;height:1.4rem;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2215%22 fill=%22%23F26A1B%22/%3E%3Crect x=%2212%22 y=%2218%22 width=%2228%22 height=%2211%22 rx=%225.5%22 fill=%22%23fff%22/%3E%3Crect x=%2224%22 y=%2235%22 width=%2228%22 height=%2211%22 rx=%225.5%22 fill=%22%23fff%22 fill-opacity=%22.72%22/%3E%3C/svg%3E") center/contain no-repeat}a{color:var(--accent)}
section{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1rem 1.25rem;margin:0 0 1rem;overflow-wrap:anywhere}
section h2{margin:0 0 .25rem;font-size:1.15rem}.meta{color:var(--mute);font-size:.85rem;margin:0 0 .75rem}
pre{overflow-x:auto;background:var(--bg);padding:.75rem;border-radius:6px;font-size:.85rem}code{font-size:.9em}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{text-align:left;padding:.4rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
.tag{display:inline-block;font-size:.75rem;padding:0 .4rem;border-radius:4px;border:1px solid var(--line);color:var(--mute)}
.open{color:var(--warn);border-color:var(--warn)}input[type=text],input[type=password]{font:inherit;padding:.35rem .5rem;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);max-width:100%}
button{font:inherit;padding:.3rem .7rem;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--fg);cursor:pointer}
form.inline{display:inline}.key{font-family:ui-monospace,monospace;background:var(--bg);padding:.5rem;border-radius:4px;user-select:all;word-break:break-all}
.paste{font-family:ui-monospace,monospace;font-size:.85rem;background:var(--bg);padding:.75rem;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere;user-select:all}
.agents{list-style:none;padding:0;margin:0 0 1rem}.agents li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem 1rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
.who{min-width:0}.who small{display:block;color:var(--mute);font-size:.8rem;overflow-wrap:anywhere}.acts{display:flex;gap:.4rem;flex-wrap:wrap}
form.row{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1rem}form.row input{flex:1 1 12rem;min-width:0}
form.stack{display:flex;flex-direction:column;gap:.6rem}form.stack input,form.stack button{width:100%;padding:.55rem .7rem}form.stack p{margin:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.add{color:var(--accent)}.del{color:var(--warn)}.wrap{overflow-x:auto}
</style></head><body><main>{{end}}
{{define "foot"}}</main></body></html>{{end}}
